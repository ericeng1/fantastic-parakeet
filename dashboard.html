<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function() {
      var t = localStorage.getItem("showoffy_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Showoffy — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-primary: 'Bebas Neue', sans-serif;
      --font-body:    'Lato', sans-serif;
      --font-accent:  'Cormorant Garamond', serif;
      --bg:      #0f0f10;
      --surface: #18181b;
      --border:  #2a2a2e;
      --text:    #f0ede8;
      --muted:   #9a9896;
      --accent:  #c8964a;
      --accent2: #8dbbd1;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--font-primary);
      font-size: 22px;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-decoration: none;
    }

    .topbar-right { display: flex; align-items: center; gap: 16px; }

    .topbar-email {
      font-size: 12px;
      color: var(--muted);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
      padding: 0;
    }

    .nav-link:hover { color: var(--text); }

    .hero {
      text-align: center;
      padding: 48px 24px 28px;
      flex-shrink: 0;
    }

    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .hero-title {
      font-family: var(--font-primary);
      font-size: clamp(36px, 8vw, 56px);
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 10px;
    }

    .hero-title span { color: var(--accent); }

    .hero-sub {
      font-family: var(--font-accent);
      font-style: italic;
      font-size: 17px;
      color: var(--muted);
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      padding: 24px 20px 40px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .brand-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      min-height: 190px;
      position: relative;
      overflow: hidden;
      animation: cardIn 0.4s ease both;
      -webkit-tap-highlight-color: transparent;
    }

    .brand-card:nth-child(1) { animation-delay: 0.05s; }
    .brand-card:nth-child(2) { animation-delay: 0.12s; }
    .brand-card:nth-child(3) { animation-delay: 0.19s; }
    .brand-card:nth-child(4) { animation-delay: 0.26s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: radial-gradient(ellipse at 20% 80%, rgba(200,150,74,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .brand-card:hover  { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,0.35); }
    .brand-card:hover::after { opacity: 1; }
    .brand-card:active { transform: translateY(-1px); }

    .brand-number {
      font-family: var(--font-accent);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      opacity: 0.7;
    }

    .brand-company {
      font-family: var(--font-primary);
      font-size: clamp(22px, 5vw, 30px);
      letter-spacing: 0.05em;
      line-height: 1.1;
      margin-bottom: 5px;
    }

    .brand-maker {
      font-family: var(--font-accent);
      font-style: italic;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .brand-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      transition: gap 0.2s;
    }

    .brand-card:hover .brand-cta { gap: 14px; }

    /* Draft indicator dot */
    .draft-dot {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 9px;
      height: 9px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotpulse 2s ease-in-out infinite;
    }

    @keyframes dotpulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.75); }
    }

    .draft-label {
      position: absolute;
      top: 14px;
      right: 32px;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.7;
    }

    .dash-footer {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dash-footer a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .dash-footer a:hover { color: var(--accent); }

    .grid-loading, .grid-empty, .grid-error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .grid-error { color: #c07070; }

    .grid-pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 4px 24px 32px;
    }

    .pager-btn {
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .pager-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .pager-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .pager-status {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
      min-width: 70px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .topbar { padding: 12px 16px; }
      .topbar-email { display: none; }
      .hero { padding: 32px 16px 20px; }
      .brand-grid { padding: 16px 16px 32px; gap: 12px; }
      .brand-card { min-height: 160px; padding: 22px 20px 20px; }
    }

    /* ── LIGHT THEME OVERRIDES ── */
    [data-theme="light"] {
      --bg:       #f4f1ec;
      --surface:  #ffffff;
      --surface2: #ebe8e2;
      --border:   #d6d1c8;
      --text:     #1c1a17;
      --muted:    #7a7570;
      --accent:   #b07d32;
      --accent2:  #4a8ba8;
      --danger:   #a03830;
      --input-bg: #f4f1ec;
    }

    html { transition: background 0.25s; }
    body { transition: background 0.25s, color 0.25s; }
    .topbar { transition: background 0.25s, border-color 0.25s; }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="home.html" class="logo">Showoffy</a>
    <div class="topbar-right">
      <span class="topbar-email" id="user-email"></span>
      <a href="my-items.html" class="nav-link">My Collection</a>
      <button class="nav-link" id="signout-btn">Sign Out</button>
    </div>
  </header>

  <div class="hero">
    <div class="hero-eyebrow">Select a brand to begin</div>
    <h1 class="hero-title">Log an <span>Item</span></h1>
    <p class="hero-sub">Choose the maker, then document your piece</p>
  </div>

  <div class="brand-grid" id="brand-grid">
    <div class="grid-loading" id="grid-loading">Loading brands…</div>
  </div>

  <div class="grid-pager" id="grid-pager" style="display:none;">
    <button class="pager-btn" id="prev-btn">← Prev</button>
    <span class="pager-status" id="pager-status"></span>
    <button class="pager-btn" id="next-btn">Next →</button>
  </div>

  <footer class="dash-footer">
    <a href="my-items.html">My Collection</a>
    <a href="index.html">Legacy Form</a>
  </footer>

  <script type="module">
    import { supabase } from "./supabaseClient.js";
    import { syncThemeFromUser } from "./theme.js";

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      // Fetch fresh user_metadata from server so theme preference is always current
      supabase.auth.getUser().then(({ data: { user: freshUser } }) => {
        syncThemeFromUser(freshUser?.user_metadata);
      });
      if (!session) { window.location.href = "login.html"; return; }

      const emailEl = document.getElementById("user-email");
        // 🔹 Fetch username from profiles table
  const { data: profile, error } = await supabase
    .from("profiles")
    .select("username")
    .eq("id", session.user.id)
    .single();

  const username = profile?.username;
      emailEl.innerHTML = `<a href="account.html" style="color:var(--muted);text-decoration:none;transition:color .2s;"
        onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'"
        >${username || session.user.email}</a>`;
      document.getElementById("signout-btn").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.href = "login.html";
      });

      // ── DYNAMIC BRAND GRID (paginated, 6 per page) ──
      const PAGE_SIZE = 6;
      let page = 0;      // zero-indexed
      let totalCount = 0;

      const gridEl   = document.getElementById("brand-grid");
      const pagerEl  = document.getElementById("grid-pager");
      const statusEl = document.getElementById("pager-status");
      const prevBtn  = document.getElementById("prev-btn");
      const nextBtn  = document.getElementById("next-btn");

      function showDraftDot(card, slug) {
        try {
          const raw = localStorage.getItem(`draft_${slug}`);
          if (!raw) return;
          const draft = JSON.parse(raw);
          if (draft.category_id || draft.material_id) {
            const label = document.createElement("span");
            label.className = "draft-label";
            label.textContent = "Draft";
            const dot = document.createElement("div");
            dot.className = "draft-dot";
            card.appendChild(label);
            card.appendChild(dot);
          }
        } catch {}
      }

      function renderBrands(brands, startIndex) {
        gridEl.innerHTML = "";
        if (!brands.length) {
          gridEl.innerHTML = `<div class="grid-empty">No brands yet.</div>`;
          return;
        }
        brands.forEach((brand, i) => {
          const num = String(startIndex + i + 1).padStart(2, "0");
          const card = document.createElement("a");
          card.href = `form-${brand.slug}.html`;
          card.className = "brand-card";
          card.id = `card-${brand.slug}`;
          card.innerHTML = `
            <div>
              <div class="brand-number">${num}</div>
              <div class="brand-company">${brand.company}</div>
              <div class="brand-maker">${brand.first_name} ${brand.last_name}</div>
            </div>
            <div class="brand-cta">Log an item →</div>`;
          gridEl.appendChild(card);
          showDraftDot(card, brand.slug);
        });
      }

      async function loadPage(p) {
        gridEl.innerHTML = `<div class="grid-loading">Loading brands…</div>`;
        const from = p * PAGE_SIZE;
        const to = from + PAGE_SIZE - 1;

        const { data, error, count } = await supabase
          .from("brands")
          .select("company, first_name, last_name, slug", { count: "exact" })
          .order("id", { ascending: true })
          .range(from, to);

        if (error) {
          gridEl.innerHTML = `<div class="grid-error">Couldn't load brands — try refreshing.</div>`;
          return;
        }

        totalCount = count ?? 0;
        renderBrands(data || [], from);

        const totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
        pagerEl.style.display = totalCount > PAGE_SIZE ? "flex" : "none";
        statusEl.textContent = `Page ${p + 1} of ${totalPages}`;
        prevBtn.disabled = p === 0;
        nextBtn.disabled = to + 1 >= totalCount;
      }

      prevBtn.addEventListener("click", () => {
        if (page === 0) return;
        page -= 1;
        loadPage(page);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      nextBtn.addEventListener("click", () => {
        page += 1;
        loadPage(page);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      loadPage(page);
    })();
  </script>

</body>
</html>
