<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function() {
      var t = localStorage.getItem("showoffy_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Add Maker — Showoffy Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="form-brand.css" />
  <style>
    /* Admin-only additions on top of form-brand.css */
    .admin-badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(200,150,74,0.35);
      background: rgba(200,150,74,0.08);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .gate-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
      gap: 12px;
    }
    .gate-title { font-family: var(--font-primary); font-size: 26px; letter-spacing: 0.06em; }
    .gate-sub { color: var(--muted); font-size: 14px; max-width: 340px; }
    .chip-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .cat-order-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .cat-order-pill {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; padding: 5px 10px; border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    }
    .cat-order-pill .num { color: var(--accent); font-weight: 700; }
    .file-preview {
      margin-top: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
    <a href="dashboard.html" class="logo">Showoffy</a>
    <div class="topbar-right">
      <button class="nav-link" id="signout-btn">Sign Out</button>
    </div>
  </header>

  <!-- ── ACCESS GATE (shown while checking / if not admin) ── -->
  <div class="gate-screen" id="gate-screen">
    <div class="gate-title">Checking access…</div>
  </div>

  <!-- ── ADMIN TOOL (hidden until admin confirmed) ── -->
  <div class="form-wrap" id="admin-wrap" style="display:none;">

    <div class="admin-badge">Admin · Add Maker</div>
    <div class="section-heading">New Maker / Brand</div>
    <p class="section-sub">Creates the brand record, links categories, and gives you a form-*.html page to add to the repo.</p>

    <div class="field-group">
      <label class="field-label" for="company">Brand / Company Name <span class="required">*</span></label>
      <input type="text" class="field-input" id="company" placeholder="e.g. Atwood Knife and Tool" />
    </div>

    <div class="field-group">
      <label class="field-label" for="first-name">Maker First Name <span class="required">*</span></label>
      <input type="text" class="field-input" id="first-name" placeholder="e.g. Peter" />
    </div>

    <div class="field-group">
      <label class="field-label" for="last-name">Maker Last Name <span class="required">*</span></label>
      <input type="text" class="field-input" id="last-name" placeholder="e.g. Atwood" />
    </div>

    <div class="field-group">
      <label class="field-label">Categories for this brand <span class="required">*</span></label>
      <div class="chip-hint">Tap in the order you want them to appear. Materials stay global — no selection needed.</div>
      <div class="chip-group" id="category-chips"></div>
      <div class="cat-order-list" id="cat-order-list"></div>
    </div>

    <div class="field-group">
      <label class="field-label" for="slug-preview">Generated file name</label>
      <input type="text" class="field-input" id="slug-preview" readonly placeholder="form-….html" />
    </div>

    <button class="btn-primary" id="create-btn">Create Maker & Download Page</button>
    <div class="status" id="status"></div>

    <div class="file-preview" id="file-preview" style="display:none;"></div>
  </div>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const gateScreen = document.getElementById("gate-screen");
    const adminWrap  = document.getElementById("admin-wrap");
    const statusEl   = document.getElementById("status");

    // ── Auth + admin gate ──
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
      throw new Error("redirecting");
    }
    const user = session.user;

    document.getElementById("signout-btn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });

    const { data: roleRow, error: roleErr } = await supabase
      .from("user_roles")
      .select("role")
      .eq("user_id", user.id)
      .single();

    if (roleErr || !roleRow || roleRow.role !== "admin") {
      gateScreen.innerHTML = `
        <div class="gate-title">Not authorized</div>
        <div class="gate-sub">This tool is restricted to Showoffy admins. If you think this is a mistake, check your account's role.</div>`;
      throw new Error("not admin");
    }

    gateScreen.style.display = "none";
    adminWrap.style.display = "block";

    // ── Slug helper ──
    function slugify(name) {
      return name
        .toLowerCase()
        .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 40) || "brand";
    }

    const companyInput = document.getElementById("company");
    const slugPreview   = document.getElementById("slug-preview");
    companyInput.addEventListener("input", () => {
      slugPreview.value = companyInput.value.trim()
        ? `form-${slugify(companyInput.value.trim())}.html`
        : "";
    });

    // ── Load categories as multi-select, ordered chips ──
    const catContainer = document.getElementById("category-chips");
    const orderList     = document.getElementById("cat-order-list");
    let selectedCategories = []; // [{id, name}] in click order

    const { data: categories, error: catErr } = await supabase
      .from("categories")
      .select("id, name")
      .order("name");

    if (catErr) {
      catContainer.innerHTML = `<span style="font-size:13px;color:#c07070;">Failed to load categories — reload page</span>`;
    } else {
      (categories || []).forEach(cat => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.dataset.id = String(cat.id);
        chip.textContent = cat.name;
        chip.addEventListener("click", () => {
          const idx = selectedCategories.findIndex(c => c.id === cat.id);
          if (idx >= 0) {
            selectedCategories.splice(idx, 1);
            chip.classList.remove("selected");
          } else {
            selectedCategories.push({ id: cat.id, name: cat.name });
            chip.classList.add("selected");
          }
          renderOrderList();
        });
        catContainer.appendChild(chip);
      });
    }

    function renderOrderList() {
      orderList.innerHTML = "";
      selectedCategories.forEach((c, i) => {
        const pill = document.createElement("div");
        pill.className = "cat-order-pill";
        pill.innerHTML = `<span class="num">${i + 1}</span> ${c.name}`;
        orderList.appendChild(pill);
      });
    }

    // ── Template for the generated form-{slug}.html ──
    function buildFormHtml({ brandId, slug, company, makerName }) {
      const title = `${company} — Add Item | Showoffy`;
      const desc  = `Log your ${company} pieces on Showoffy — track category, material, photos, and details for your collection.`;
      return `<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function() {
      var t = localStorage.getItem("showoffy_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  <\/script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>${title}</title>
  <meta name="description" content="${desc}" />
  <meta name="robots" content="noindex, nofollow" />
  <!--<link rel="canonical" href="https://www.showoffy.app/${slug}.html" />-->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="${title}" />
  <meta property="og:description" content="${desc}" />
  <meta property="og:site_name" content="Showoffy" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="${title}" />
  <meta name="twitter:description" content="${desc}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="form-brand.css" />
</head>
<body>

  <header class="topbar">
    <a href="dashboard.html" class="back-btn">← Brands</a>
    <a href="dashboard.html" class="logo">Showoffy</a>
    <div class="topbar-right">
      <a href="my-items.html" class="nav-link">My Items</a>
      <button class="nav-link" id="signout-btn">Sign Out</button>
    </div>
  </header>

  <div class="brand-hero">
    <div class="brand-hero-eyebrow">Adding item for</div>
    <div class="brand-hero-name">${company}</div>
    <div class="brand-hero-maker">${makerName}</div>
  </div>

  <div class="step-indicator">
    <div class="step-dot active" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <span class="step-label" id="step-label-text">Step 1 of 2</span>
  </div>

  <div class="form-wrap">

    <div class="step-panel active" id="step-1">
      <div class="section-heading">The essentials</div>
      <p class="section-sub">Category, material, and photos — that's all we need.</p>

      <div class="field-group">
        <label class="field-label">Category <span class="required">*</span></label>
        <div class="chip-group" id="category-chips"></div>
      </div>

      <div class="field-group">
        <label class="field-label">Material <span class="required">*</span></label>
        <div class="chip-group" id="material-chips"></div>
      </div>

      <div class="field-group">
        <label class="field-label">Photos</label>
        <div class="photo-zone" id="photo-zone">
          <div class="photo-zone-icon">📷</div>
          <div class="photo-zone-text">Tap to take or choose photos</div>
          <div class="photo-zone-hint">Up to 10 photos · Uploads instantly</div>
        </div>
        <input type="file" id="photo-input" accept="image/*" multiple
               style="position:absolute;opacity:0;width:0;height:0;pointer-events:none;" />
        <div class="thumb-strip" id="thumb-strip"></div>
      </div>

      <div class="field-group">
        <div class="privacy-actions">
          <label class="privacy-row-inner" for="is-private">
            <div class="privacy-info">
              <div class="privacy-title">Private entry</div>
              <div class="privacy-desc">Only visible to you</div>
            </div>
            <div class="toggle-wrap">
              <input type="checkbox" id="is-private" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </div>
          </label>
        </div>
      </div>

      <button class="btn-primary" id="next-btn">Continue →</button>
    </div>

    <div class="step-panel" id="step-2">
      <div class="section-heading">Optional details</div>
      <p class="section-sub">Skip anytime — you can add these later.</p>

      <div class="field-group">
        <label class="field-label" for="variant">Variant</label>
        <input type="text" class="field-input" id="variant" placeholder="e.g. variant name…" />
      </div>

      <div class="field-group">
        <label class="field-label" for="size">Size (inches)</label>
        <input type="number" class="field-input" id="size" step="0.01" placeholder="e.g. 2.75" inputmode="decimal" />
      </div>

      <div class="field-group">
        <label class="field-label" for="msrp">MSRP ($)</label>
        <input type="number" class="field-input" id="msrp" step="0.01" placeholder="e.g. 145.00" inputmode="decimal" />
      </div>

      <div class="field-group">
        <label class="field-label" for="born-on">Date Acquired</label>
        <div class="date-wrap">
          <input type="date" class="field-input" id="born-on" />
          <button type="button" class="date-cal-btn" id="born-on-cal-btn" title="Open calendar" aria-label="Open calendar">📅</button>
        </div>
        <button type="button" class="date-today-btn" id="born-on-today-btn">⊕ Use today's date</button>
      </div>

      <div class="field-group">
        <label class="field-label" for="extra">Extra</label>
        <input type="text" class="field-input" id="extra" placeholder="Any extra detail…" />
      </div>

      <div class="field-group">
        <label class="field-label" for="comments">Personal Notes</label>
        <textarea class="field-textarea" id="comments" placeholder="Private notes about this piece…"></textarea>
      </div>

      <button class="btn-primary" id="save-btn">Save Item ✓</button>
      <button class="btn-skip" id="save-skip-btn">Skip and save without details</button>
      <button class="btn-secondary" id="back-btn">← Back to essentials</button>
    </div>

    <div class="success-state" id="success-state">
      <div class="success-icon">✓</div>
      <div class="success-title">Item Saved!</div>
      <p class="success-sub">Your ${company} piece has been logged.</p>
      <div class="success-actions">
        <button class="btn-primary" id="add-another-btn">Add Another</button>
        <a href="my-items.html" class="btn-secondary">View My Collection</a>
        <a href="dashboard.html" class="btn-secondary">Back to Dashboard</a>
      </div>
    </div>

  </div>

  <script type="module">
    import { requireAuth, haptic, showToast,
             initProgressiveUpload, saveItem, addNewLookup, loadChips,
             initDatePicker, setToday, readPrefillParams,
             CATEGORY_MATERIAL_DEFAULTS } from "./form-shared.js";
    import { syncThemeFromUser } from "./theme.js";

    const MAKER_ID = ${brandId};
    const BRAND_ID = ${brandId};  // ${company}

    (async () => {
      const user = await requireAuth();
      if (!user) return;
      syncThemeFromUser(user.user_metadata);

      document.getElementById("signout-btn").addEventListener("click", async () => {
        const { supabase } = await import("./supabaseClient.js");
        await supabase.auth.signOut();
        window.location.href = "login.html";
      });

      let selectedCategoryId  = null;
      let selectedMaterialId  = null;
      let materialPickedByUser = false;

      const PHOTO_KEY = "photos_${slug}";
      let uploadedUrls = (() => {
        try { return JSON.parse(localStorage.getItem(PHOTO_KEY) || "[]"); }
        catch { return []; }
      })();

      const categoryChips = await loadChips({
        table:       "categories",
        containerId: "category-chips",
        addChipId:   "add-category-chip",
        brandId:     BRAND_ID,
        onSelect:    id => { selectedCategoryId = id; },
      });

      const materialChips = await loadChips({
        table:       "materials",
        containerId: "material-chips",
        addChipId:   "add-material-chip",
        onSelect:    id => {
          selectedMaterialId   = id;
          materialPickedByUser = true;
        },
      });

      const catContainer = document.getElementById("category-chips");
      catContainer.querySelectorAll(".chip:not(.chip-add)").forEach(chip => {
        chip.addEventListener("click", () => {
          if (materialPickedByUser) return;
          const catId    = parseInt(chip.dataset.id);
          const defaults = CATEGORY_MATERIAL_DEFAULTS[catId];
          if (defaults?.length) {
            materialChips.setSelected(defaults[0]);
            selectedMaterialId = defaults[0];
          }
        });
      });

      categoryChips.getAddChip().addEventListener("click", async () => {
        const result = await addNewLookup("categories", BRAND_ID);
        if (!result) return;
        categoryChips.addAndSelect(result.id, result.name);
        selectedCategoryId = result.id;
      });

      materialChips.getAddChip().addEventListener("click", async () => {
        const result = await addNewLookup("materials");
        if (!result) return;
        materialChips.addAndSelect(result.id, result.name);
        selectedMaterialId = result.id;
      });

      const photoInput = document.getElementById("photo-input");
      const thumbStrip = document.getElementById("thumb-strip");
      const photoZone  = document.getElementById("photo-zone");

      photoZone.addEventListener("click", (e) => {
        if (e.target === photoInput) return;
        photoInput.click();
      });

      const uploader = initProgressiveUpload({
        inputEl:      photoInput,
        previewEl:    thumbStrip,
        userId:       user.id,
        onUrlsChange: (urls) => {
          uploadedUrls = urls;
          try { localStorage.setItem(PHOTO_KEY, JSON.stringify(urls)); } catch {}
        },
      });

      if (uploadedUrls.length) uploader.setUrls(uploadedUrls);

      initDatePicker("born-on", "born-on-cal-btn");
      document.getElementById("born-on-today-btn").addEventListener("click", () => {
        setToday("born-on");
        haptic("light");
      });

      const prefill = readPrefillParams();
      if (prefill) {
        if (prefill.category_id) { categoryChips.setSelected(prefill.category_id); selectedCategoryId = prefill.category_id; }
        if (prefill.material_id) { materialChips.setSelected(prefill.material_id); selectedMaterialId = prefill.material_id; materialPickedByUser = true; }
        if (prefill.variant)     document.getElementById("variant").value = prefill.variant;
        if (prefill.size)        document.getElementById("size").value    = prefill.size;
        if (prefill.msrp)        document.getElementById("msrp").value    = prefill.msrp;
        if (prefill.extra)       document.getElementById("extra").value   = prefill.extra;
        if (prefill.is_private)  document.getElementById("is-private").checked = true;
        showToast("Fields carried over from similar item", "info");
        haptic("light");
      }

      function goToStep(n) {
        document.querySelectorAll(".step-panel").forEach(p => p.classList.remove("active"));
        document.getElementById(\`step-\${n}\`).classList.add("active");
        document.querySelectorAll(".step-dot").forEach((d, i) => {
          d.classList.remove("active", "done");
          if (i + 1 < n) d.classList.add("done");
          if (i + 1 === n) d.classList.add("active");
        });
        document.getElementById("step-label-text").textContent = \`Step \${n} of 2\`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.getElementById("next-btn").addEventListener("click", () => {
        if (!selectedCategoryId) { haptic("error"); showToast("Please select a category", "error"); return; }
        if (!selectedMaterialId) { haptic("error"); showToast("Please select a material", "error"); return; }
        haptic("medium");
        goToStep(2);
      });

      document.getElementById("back-btn").addEventListener("click", () => goToStep(1));

      async function doSave(withStep2) {
        const btnId   = withStep2 ? "save-btn" : "save-skip-btn";
        const saveBtn = document.getElementById(btnId);
        saveBtn.disabled = true;

        const step2 = withStep2 ? {
          variant:      document.getElementById("variant").value.trim()  || null,
          size:         document.getElementById("size").value            || null,
          msrp:         document.getElementById("msrp").value            || null,
          born_on_date: document.getElementById("born-on").value         || null,
          extra:        document.getElementById("extra").value.trim()    || null,
          comments:     document.getElementById("comments").value.trim() || null,
        } : null;

        try {
          showToast("Saving…", "info");
          await saveItem({
            makerId:   MAKER_ID,
            userId:    user.id,
            imageUrls: uploadedUrls,
            step1:     { category_id: selectedCategoryId, material_id: selectedMaterialId, is_private: document.getElementById("is-private").checked },
            step2,
          });

          haptic("success");
          try { localStorage.removeItem(PHOTO_KEY); } catch {}
          document.querySelector(".step-indicator").style.display = "none";
          document.querySelector(".brand-hero").style.display     = "none";
          document.getElementById("step-1").classList.remove("active");
          document.getElementById("step-2").classList.remove("active");
          document.getElementById("success-state").classList.add("visible");
          window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (err) {
          haptic("error");
          showToast("Save failed: " + err.message, "error");
          saveBtn.disabled = false;
        }
      }

      document.getElementById("save-btn").addEventListener("click",       () => doSave(true));
      document.getElementById("save-skip-btn").addEventListener("click",  () => doSave(false));
      document.getElementById("add-another-btn").addEventListener("click", () => window.location.reload());

    })();
  <\/script>

</body>
</html>
`;
    }

    // ── Create maker ──
    document.getElementById("create-btn").addEventListener("click", async () => {
      const company   = companyInput.value.trim();
      const firstName = document.getElementById("first-name").value.trim();
      const lastName  = document.getElementById("last-name").value.trim();
      const btn = document.getElementById("create-btn");

      if (!company || !firstName || !lastName) {
        statusEl.textContent = "Please fill in brand name and maker's first/last name.";
        statusEl.style.color = "var(--error)";
        return;
      }
      if (selectedCategories.length === 0) {
        statusEl.textContent = "Select at least one category for this brand.";
        statusEl.style.color = "var(--error)";
        return;
      }

      btn.disabled = true;
      statusEl.textContent = "Creating brand…";
      statusEl.style.color = "var(--muted)";

      try {
        // 1. Insert brand
        const { data: brand, error: brandErr } = await supabase
          .from("brands")
          .insert([{ company, first_name: firstName, last_name: lastName }])
          .select("id")
          .single();
        if (brandErr) throw new Error("Brand insert failed: " + brandErr.message);

        const brandId = brand.id;

        // 2. Insert brand_categories, preserving selection order
        const linkRows = selectedCategories.map((c, i) => ({
          brand_id: brandId,
          category_id: c.id,
          sort_order: i + 1,
        }));
        const { error: linkErr } = await supabase.from("brand_categories").insert(linkRows);
        if (linkErr) throw new Error("Category linking failed: " + linkErr.message);

        // 3. Build + download the form-{slug}.html file
        const slug = slugify(company);
        const filename = `form-${slug}.html`;
        const html = buildFormHtml({
          brandId,
          slug,
          company,
          makerName: `${firstName} ${lastName}`,
        });

        const blob = new Blob([html], { type: "text/html" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusEl.textContent = `✓ Brand "${company}" created (id ${brandId}). ${filename} downloaded — add it to your repo.`;
        statusEl.style.color = "var(--success)";

        const preview = document.getElementById("file-preview");
        preview.style.display = "block";
        preview.textContent = `Brand ID: ${brandId}\nFile: ${filename}\nCategories linked: ${selectedCategories.map(c => c.name).join(", ")}`;

      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        statusEl.style.color = "var(--error)";
      } finally {
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
